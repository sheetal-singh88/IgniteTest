<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }
  </style>
</head>
<body>
  <login-macrocomponent></login-macrocomponent>

  <script>
    class ShadowInput extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        const label = this.getAttribute('label') || '';
        const type = this.getAttribute('type') || 'text';
        const name = this.getAttribute('name') || '';

        this.shadowRoot.innerHTML = `
          <style>
            .field {
              display: flex;
              flex-direction: column;
              gap: 6px;
              margin-bottom: 16px;
            }
            label {
              font-size: 14px;
              color: #333;
              font-weight: 600;
            }
            input {
              padding: 10px 12px;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              font-size: 14px;
              outline: none;
            }
            input:focus {
              border-color: #2563eb;
              box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }
          </style>
          <div class="field">
            <label>${label}</label>
            <input type="${type}" name="${name}" />
          </div>
        `;
      }

      getValue() {
        return this.shadowRoot.querySelector('input').value;
      }
    }

    class ShadowButton extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        const text = this.getAttribute('text') || 'Submit';
        this.shadowRoot.innerHTML = `
          <style>
            button {
              width: 100%;
              padding: 12px;
              background: #2563eb;
              color: #fff;
              border: none;
              border-radius: 8px;
              font-size: 15px;
              font-weight: 600;
              cursor: pointer;
            }
            button:hover {
              background: #1d4ed8;
            }
          </style>
          <button type="button">${text}</button>
        `;
      }

      getButton() {
        return this.shadowRoot.querySelector('button');
      }
    }

    class ShadowMessage extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        this.shadowRoot.innerHTML = `
          <style>
            .message {
              margin-top: 16px;
              padding: 10px 12px;
              border-radius: 8px;
              font-size: 14px;
              font-weight: 600;
              display: none;
            }
            .success {
              background: #dcfce7;
              color: #166534;
              border: 1px solid #86efac;
            }
            .error {
              background: #fee2e2;
              color: #991b1b;
              border: 1px solid #fca5a5;
            }
          </style>
          <div class="message"></div>
        `;
      }

      showMessage(text, type) {
        const box = this.shadowRoot.querySelector('.message');
        box.className = `message ${type}`;
        box.textContent = text;
        box.style.display = 'block';
      }
    }

    class LoginMacroComponent extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        this.shadowRoot.innerHTML = `
          <style>
            .wrapper {
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 24px;
              box-sizing: border-box;
            }
            .card {
              width: 100%;
              max-width: 380px;
              background: #ffffff;
              border-radius: 16px;
              padding: 28px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
              box-sizing: border-box;
            }
            h2 {
              margin: 0 0 20px 0;
              text-align: center;
              color: #111827;
            }
          </style>
          <div class="wrapper">
            <div class="card">
              <h2>Login Page</h2>
              <shadow-input id="username" label="Username" type="text" name="username"></shadow-input>
              <shadow-input id="password" label="Password" type="password" name="password"></shadow-input>
              <shadow-button id="loginBtn" text="Login"></shadow-button>
              <shadow-message id="messageBox"></shadow-message>
            </div>
          </div>
        `;

        const usernameEl = this.shadowRoot.querySelector('#username');
        const passwordEl = this.shadowRoot.querySelector('#password');
        const buttonEl = this.shadowRoot.querySelector('#loginBtn');
        const messageEl = this.shadowRoot.querySelector('#messageBox');

        buttonEl.getButton().addEventListener('click', () => {
          const username = usernameEl.getValue();
          const password = passwordEl.getValue();

          if (username === 'admin' && password === 'admin123') {
            messageEl.showMessage('Login Successfull!', 'success');
          } else {
            messageEl.showMessage('Please provide correct details!', 'error');
          }
        });
      }
    }

    customElements.define('shadow-input', ShadowInput);
    customElements.define('shadow-button', ShadowButton);
    customElements.define('shadow-message', ShadowMessage);
    customElements.define('login-macrocomponent', LoginMacroComponent);
  </script>
</body>
</html>
