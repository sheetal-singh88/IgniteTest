<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }
  </style>
</head>
<body>
  <login-macrocomponent></login-macrocomponent>

  <script>
    class ShadowMessage extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        this.shadowRoot.innerHTML = `
          <style>
            .message {
              margin-top: 16px;
              padding: 10px 12px;
              border-radius: 8px;
              font-size: 14px;
              font-weight: 600;
              display: none;
            }
            .success {
              background: #dcfce7;
              color: #166534;
              border: 1px solid #86efac;
            }
            .error {
              background: #fee2e2;
              color: #991b1b;
              border: 1px solid #fca5a5;
            }
          </style>
          <div class="message"></div>
        `;
      }

      showMessage(text, type) {
        const box = this.shadowRoot.querySelector('.message');
        box.className = `message ${type}`;
        box.textContent = text;
        box.style.display = 'block';
      }
    }

    class LoginMacroComponent extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        // Frame 1 content - Credentials
        const frame1HTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label {
      font-size: 14px;
      color: #333;
      font-weight: 600;
    }
    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" name="username" placeholder="Enter username" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" name="password" placeholder="Enter password" />
  </div>
</body>
</html>`;

        // Frame 2 content - Login Button
        const frame2HTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <button type="button" id="loginBtn">Login</button>
</body>
</html>`;

        // Parent frame content
        const parentHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }
    .frame-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .child-frame-wrapper {
      display: flex;
      flex-direction: column;
    }
    .child-frame-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    iframe {
      width: 100%;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #ffffff;
    }
    #frame1 {
      height: 200px;
    }
    #frame2 {
      height: 100px;
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="child-frame-wrapper">
      <div class="child-frame-label">📋 Frame 1 - Credentials</div>
      <iframe id="frame1" src="data:text/html;charset=utf-8,${encodeURIComponent(frame1HTML)}"></iframe>
    </div>
    <div class="child-frame-wrapper">
      <div class="child-frame-label">🔘 Frame 2 - Action</div>
      <iframe id="frame2" src="data:text/html;charset=utf-8,${encodeURIComponent(frame2HTML)}"></iframe>
    </div>
  </div>
</body>
</html>`;

        this.shadowRoot.innerHTML = `
          <style>
            .wrapper {
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 24px;
              box-sizing: border-box;
            }
            .card {
              width: 100%;
              max-width: 520px;
              background: #ffffff;
              border-radius: 16px;
              padding: 28px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
              box-sizing: border-box;
            }
            h2 {
              margin: 0 0 20px 0;
              text-align: center;
              color: #111827;
            }
            .frame-label {
              font-size: 12px;
              font-weight: 700;
              color: #2563eb;
              margin-bottom: 8px;
              text-transform: uppercase;
              letter-spacing: 0.5px;
            }
            .parent-iframe {
              width: 100%;
              height: 450px;
              border: 3px solid #2563eb;
              border-radius: 12px;
              background: #f8fafc;
            }
            .message-container {
              margin-top: 16px;
            }
          </style>
          <div class="wrapper">
            <div class="card">
              <h2>Login Page with Nested iFrames</h2>
              <div class="frame-label">🔲 Parent iFrame</div>
              <iframe id="parentFrame" class="parent-iframe" src="data:text/html;charset=utf-8,${encodeURIComponent(parentHTML)}"></iframe>
              <div class="message-container">
                <shadow-message id="messageBox"></shadow-message>
              </div>
            </div>
          </div>
        `;

        const parentFrame = this.shadowRoot.querySelector('#parentFrame');
        const messageEl = this.shadowRoot.querySelector('#messageBox');
        
        // Wait for all frames to load
        parentFrame.addEventListener('load', () => {
          setTimeout(() => {
            try {
              const parentDoc = parentFrame.contentWindow.document;
              const frame1 = parentDoc.getElementById('frame1');
              const frame2 = parentDoc.getElementById('frame2');

              // Wait for child frames to load
              let frame1Loaded = false;
              let frame2Loaded = false;

              const setupLogin = () => {
                if (frame1Loaded && frame2Loaded) {
                  try {
                    const frame1Doc = frame1.contentWindow.document;
                    const frame2Doc = frame2.contentWindow.document;
                    
                    const loginBtn = frame2Doc.getElementById('loginBtn');
                    const usernameInput = frame1Doc.getElementById('username');
                    const passwordInput = frame1Doc.getElementById('password');

                    if (loginBtn && usernameInput && passwordInput) {
                      loginBtn.addEventListener('click', () => {
                        const username = usernameInput.value;
                        const password = passwordInput.value;

                        if (username === 'admin' && password === 'admin123') {
                          messageEl.showMessage('Login Successful!', 'success');
                        } else {
                          messageEl.showMessage('Please provide correct details!', 'error');
                        }
                      });
                    }
                  } catch (e) {
                    console.error('Error setting up login:', e);
                  }
                }
              };

              frame1.addEventListener('load', () => {
                frame1Loaded = true;
                setupLogin();
              });

              frame2.addEventListener('load', () => {
                frame2Loaded = true;
                setupLogin();
              });

            } catch (e) {
              console.error('Error accessing frames:', e);
            }
          }, 500);
        });
      }
    }

    customElements.define('shadow-message', ShadowMessage);
    customElements.define('login-macrocomponent', LoginMacroComponent);
  </script>
</body>
</html>
